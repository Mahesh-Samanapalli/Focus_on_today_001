<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In – Focus On Today</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <h1 class="heading">
      <span class="focus">Focus on</span>
      <span class="today">Today</span>
    </h1>

    <div class="container auth-container">
      <div class="auth-header">
        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-subtitle">Sign in to continue your journey</p>
      </div>

      <form class="auth-form" id="signinForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-row">
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-row password-row">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row-inline">
          <label class="remember-label">
            <input type="checkbox" class="remember-checkbox" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <p class="auth-message" id="signinMessage" aria-live="polite"></p>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="signup.html" class="auth-link">Sign Up</a>
      </p>
    </div>

    <script src="signin.js" defer></script>
  </body>
</html>
