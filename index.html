<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus On Today</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 class="heading">
      <span class="focus">Focus on</span>
      <span class="today">Today</span>
    </h1>
    <div class="container">
      <div class="container-content">
        <h1 class="container-heading">
          <span>Today</span> <img src="images/image.png" alt="today" />
        </h1>
      </div>
      <div class="progress-section">
        <p class="progress-text">Raise the bar by completing your goals!</p>
        <div class="progress-bar">
          <div class="progress-value"></div>
        </div>
      </div>
      <div class="goal-cnt">
        <div class="goal-row goal-one">
          <input type="checkbox" />
          <input type="text" placeholder="Add your goal" />
        </div>

        <div class="goal-row goal-two">
          <input type="checkbox" />
          <input type="text" placeholder="Add your goal" />
        </div>

        <div class="goal-row goal-three">
          <input type="checkbox" />
          <input type="text" placeholder="Add your goal" />
        </div>
      </div>
    </div>
  </body>
</html>
