<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up – Focus On Today</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <h1 class="heading">
      <span class="focus">Focus on</span>
      <span class="today">Today</span>
    </h1>

    <div class="container auth-container">
      <div class="auth-header">
        <h2 class="auth-title">Create your account</h2>
        <p class="auth-subtitle">Start achieving your goals today</p>
      </div>

      <form class="auth-form" id="signupForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="fullname">Full name</label>
          <div class="input-row">
            <input
              type="text"
              id="fullname"
              class="form-input"
              placeholder="John Doe"
              autocomplete="name"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-row">
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-row password-row">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="password-strength" id="strengthBar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <p class="strength-label" id="strengthLabel"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <div class="input-row password-row">
            <input
              type="password"
              id="confirmPassword"
              class="form-input"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-confirm" aria-label="Toggle confirm password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p class="match-label" id="matchLabel"></p>
        </div>

        <div class="form-row-inline terms-row">
          <label class="remember-label">
            <input type="checkbox" class="remember-checkbox" id="termsCheck" required />
            <span>I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a></span>
          </label>
        </div>

        <p class="auth-message" id="signupMessage" aria-live="polite"></p>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="signin.html" class="auth-link">Sign In</a>
      </p>
    </div>

    <script src="signup.js" defer></script>
  </body>
</html>
